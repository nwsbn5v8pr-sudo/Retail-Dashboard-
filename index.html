<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Manager Performance Tracker</title><style>
:root{--bg:#f8f5ef;--card:#fffdf9;--ink:#17252a;--muted:#687276;--forest:#174f43;--sage:#78a892;--sage2:#e5f0e8;--amber:#e5a83b;--amber2:#fff0d1;--coral:#d95c55;--coral2:#fbe4e1;--line:#e7e1d8;--shadow:0 8px 26px rgba(30,45,41,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}.app{display:flex;min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:#f4f0e8;border-right:1px solid var(--line);padding:28px 14px;z-index:2}.brand{font-weight:800;font-size:19px;line-height:1.02;padding:0 14px 25px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;margin-top:8px}.nav{width:100%;border:0;background:none;text-align:left;padding:12px 13px;border-radius:11px;color:#384347;font-weight:650;margin:3px 0}.nav.active{background:#dce9de;color:var(--forest)}main{margin-left:220px;width:calc(100% - 220px);padding:30px;max-width:1450px}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:15px}h1{font-size:40px;letter-spacing:-1.7px;line-height:1.05;margin:0 0 6px}.sub{color:var(--muted);font-size:14px}.week,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.week{padding:11px 14px;font-size:12px;color:var(--muted)}.week b{display:block;color:var(--ink);margin-top:3px}.pad{padding:19px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{min-height:155px}.kpi-link{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.kpi-link:hover,.kpi-link:focus-visible{transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,45,41,.11);outline:2px solid var(--sage);outline-offset:2px}.attention-link{width:100%;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}.attention-link:hover,.attention-link:focus-visible{background:#fffaf7;outline:2px solid var(--sage);outline-offset:1px}.kpi b{font-size:14px}.metric{font-size:30px;font-weight:800;letter-spacing:-1px;margin:14px 0 2px}.goal{font-size:12px;color:var(--muted)}.bar{height:8px;background:#e4e9e5;border-radius:20px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--sage);border-radius:20px}.bar i.warn{background:var(--amber)}.bar i.bad{background:var(--coral)}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:15px;margin-top:15px}.attention{background:#fff9f6}.label{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--forest)}.attn{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #efe7df;border-radius:12px;padding:11px;margin-top:8px}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#f7c9c3;color:#a7463e}.num.amber{background:#f9e1ad;color:#8c6418}.attn small{display:block;color:var(--muted);margin-top:2px}.focus{min-height:245px;background:#eef4ef;border-color:#dce8df;display:flex;flex-direction:column;justify-content:center}.focus h2{font-size:31px;line-height:1.08;letter-spacing:-1px;margin:12px 0 9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini div{background:#f8f7f3;border-radius:12px;padding:14px}.mini strong{font-size:24px;display:block}.mini span{font-size:12px;color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.head h2{font-size:19px;margin:0}.head p{font-size:12px;color:var(--muted);margin:3px 0 0}.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--forest);color:#fff;font-weight:750}.btn.alt{background:#edf2ed;color:var(--forest)}.btn.danger{background:var(--coral2);color:#a3433d}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:12px}th{background:#faf8f4;color:#747c79;font-size:10px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border:0}input,select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;width:100%}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800}.good{background:var(--sage2);color:#28614e}.warn{background:var(--amber2);color:#8b6419}.bad{background:var(--coral2);color:#a3433d}.check{width:18px;height:18px;border:1.5px solid #9aa19d;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:9px}.action{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.action:last-child{border:0}.action-edit{display:flex;gap:8px;align-items:center}.action-input{flex:1;margin:0}.action-delete{border:0;background:var(--coral2);color:#a3433d;border-radius:8px;width:36px;height:36px;font-size:20px;cursor:pointer}.huddle{padding:25px;background:#f3ece6;border:1px solid #e9ddd3;border-radius:14px}.huddle h2{font-size:32px;line-height:1.08;margin:10px 0}.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.hbox{padding:17px;border-radius:13px;background:#f4f7f0}.hbox:nth-child(2){background:#fff4df}.hbox b{display:block;font-size:11px;color:#6c746f;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}.cell-input{min-width:110px;margin:0}.cell-num{width:80px;min-width:0}.status-select{width:auto;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;padding:6px 10px}td .action-delete{width:30px;height:30px;font-size:17px}.notice{padding:12px 14px;border-radius:11px;background:#f3f5f2;color:#53605c;font-size:12px;margin-top:12px}

@media(max-width:700px){.app{display:block}.side{position:static;width:100%;padding:12px;height:auto}.brand{padding:3px 10px 12px}main{margin:0;width:100%;padding:15px}.nav{display:inline-block;width:24%;text-align:center;font-size:11px}.top{display:block}h1{font-size:32px}.week{margin-top:10px}.grid4{grid-template-columns:1fr 1fr}.hgrid{grid-template-columns:1fr}}
.btn{cursor:pointer}.btn-row{display:flex;flex-wrap:wrap;gap:8px}.file-btn{display:inline-block;position:relative;overflow:hidden;margin:0;font-size:13.333px;font-weight:750;color:var(--forest);cursor:pointer}.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.welcome{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px;background:#eef4ef;border-color:#cfe0d4}.welcome p{margin:5px 0 0;font-size:13px;color:#53605c;max-width:640px}.welcome-actions{display:flex;gap:8px;flex-shrink:0}.backup-notice{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 15px;background:var(--amber2);color:#6d5216}

</style></head><body><div class="app"><aside class="side"><div class="brand">Manager<br>Performance<small>KNOW · COACH · ACT</small></div><div id="nav"></div></aside><main><div id="pages"></div></main></div><script src="./app.js?v=11" defer></script></body></html>
